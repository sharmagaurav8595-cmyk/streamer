services:
  app:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-5}
      MAX_STORAGE_GB: ${MAX_STORAGE_GB:-20}
    volumes:
      - streamloop_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  streamloop_data:
  caddy_data:
  caddy_config:
